# ============================================
# 简易校园公告资讯小程序 - Docker Compose 编排
# 包含：backend(FastAPI) + mysql + redis + nginx
# 启动：docker-compose up -d
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: campus_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: campus_notice
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - campus_net

  redis:
    image: redis:7-alpine
    container_name: campus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-please-change-this-to-a-very-long-random-secret-string-for-production}
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: 123456
      DATABASE_NAME: campus_notice
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "True"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - campus_net

  nginx:
    image: nginx:1.25-alpine
    container_name: campus_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    networks:
      - campus_net

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  campus_net:
    driver: bridge
